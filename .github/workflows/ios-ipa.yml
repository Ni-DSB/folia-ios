name: Build iOS IPA (unsigned)

# 产出未签名 Folia.ipa：签名由使用者自行完成（Sideloadly / AltStore / 自备证书）。
#
# 这一版是「独立 App」：插件引擎跑在 App 自己的 WebView 里
# （src/services/onlineMusic/customSourceEngine/），不再需要电脑上跑服务端。
#   · 前端 dist 直接打进 App
#   · 插件经 CapacitorHttp 发请求（原生实现：可带 Referer/User-Agent，且不受 CORS 约束）
#   · 插件列表存在 App 内的 IndexedDB
#
# 为什么在 macOS runner 上跑：xcodebuild 只有 macOS 有；公开仓库用它不额外计费，无需自备 Mac。

on:
  workflow_dispatch:
  push:
    # 推到这两个分支都构建：main 是仓库默认分支，ios-ipa 留给专门试打包的分支。
    branches: [main, ios-ipa]
    paths:
      - '.github/workflows/ios-ipa.yml'
      - 'deploy/ios/**'
      - 'src/services/onlineMusic/customSourceEngine/**'
      - 'src/services/onlineMusic/customSource/**'
      - 'package.json'
      - 'vite.config.ts'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    # 发布 Release 需要写权限；artifact 下载要登录，Release 资产可以匿名下载。
    permissions:
      contents: write
    env:
      # 只构建 Web 产物，不需要桌面端运行时。
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build web bundle (in-app plugin engine)
        run: npm run build:ios

      - name: Verify engine is bundled
        run: |
          set -euo pipefail
          test -d dist || { echo "dist 缺失"; exit 1; }
          # 引擎必须进包，否则 App 里插件源整个不可用。
          # 判据用「动态 import 生成的独立 chunk」+「模块表里的字面量」：打包后源码路径不保留，
          # 但字符串字面量保留（"Cannot find module" 来自 moduleTable 的解析失败分支）。
          ls dist/assets/engine-*.js >/dev/null 2>&1 || { echo "✗ 没找到引擎 chunk（engine-*.js）" >&2; exit 1; }
          grep -rl "Cannot find module" dist/assets >/dev/null 2>&1 || { echo "✗ 引擎 chunk 里找不到模块表特征" >&2; exit 1; }
          echo "✓ 应用内引擎已打进产物"
          ls -la dist/assets/engine-*.js

      - name: Install Capacitor (iOS)
        run: npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/ios@8

      - name: Write Capacitor config
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const cfg = {
              appId: "top.izuna.foliamajor",
              appName: "Folia",
              webDir: "dist",
              ios: { contentInset: "never", limitsNavigationsToAppBoundDomains: false },
              plugins: {
                CapacitorHttp: { enabled: true },
                SplashScreen: { launchAutoHide: true, launchShowDuration: 600, backgroundColor: "#09090b", showSpinner: false },
                StatusBar: { overlaysWebView: true, style: "LIGHT", backgroundColor: "#09090b" },
              },
            };
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
            console.log(JSON.stringify(cfg, null, 2));
          '

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync web assets
        run: npx cap sync ios

      - name: Configure Info.plist
        run: |
          set -euo pipefail
          PLIST="ios/App/App/Info.plist"
          # 插件会请求 http 接口（部分源站只有 http），ATS 需要放开。
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
          # 后台播放：锁屏后不被挂起
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"

      - name: Build unsigned .app
        working-directory: ios/App
        run: |
          set -euo pipefail
          if [ -d App.xcworkspace ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
              -sdk iphoneos -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          else
            xcodebuild -project App.xcodeproj -scheme App -configuration Release \
              -sdk iphoneos -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          fi

      - name: Package into .ipa
        run: |
          set -euo pipefail
          APP=$(find ios/App/build -name 'App.app' -type d | head -1)
          [ -n "$APP" ] || { echo "找不到 App.app" >&2; exit 1; }
          rm -rf Payload Folia.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          # ipa 就是含 Payload/ 的 zip。
          # 注意：不用系统的 zip。macOS 系统 `zip` 对中文文件名（built-sources 里的 猫耳FM.js）
          # 可能按本地编码写坏（实测会变 GBK 乱码，导致清单里引用的文件名和包内文件名对不上、
          # 该插件源加载 404）。ditto 是 Apple 为 .app/.ipa 打包的标准工具：
          # 正确保留 UTF-8 文件名、POSIX 权限、符号链接与 codesign 元数据。
          ditto -c -k --sequesterRsrc --keepParent Payload Folia.ipa
          ls -lh Folia.ipa
          du -sh Payload/App.app

      - name: Verify bundled-sources filenames are intact
        run: |
          set -euo pipefail
          # 回归校验：清单(public/bundled-sources/manifest.json)里引用的文件名必须与 ipa 内
          # 实际文件名逐一对上，否则插件源在 iPhone 上会 404。
          #
          # ditto 打包中文名时不设 zip 的 UTF-8 标志位（flag_bits & 0x800 == 0），Python 的
          # zipfile 于是按 cp437 解码，得到乱码 —— 会让本校验误报「清单引用 猫耳FM.js 但包内
          # 没有该文件」。所以这里对每个条目用原始字节再按 UTF-8 试解一次：谁解得通用谁。
          python3 - <<'PY'
          import json
          import zipfile

          z = zipfile.ZipFile("Folia.ipa")


          def real_name(info):
              """条目的真实文件名：优先 UTF-8 标志，其次按原始字节试 UTF-8，最后退回 zipfile 结果。"""
              if info.flag_bits & 0x800:
                  return info.filename
              raw = info.filename.encode("cp437", errors="replace")
              try:
                  return raw.decode("utf-8")
              except UnicodeDecodeError:
                  return info.filename


          names = [real_name(i) for i in z.infolist()]
          bs = [n for n in names if "/bundled-sources/" in n and n.endswith(".js")]
          if not bs:
              raise SystemExit("ios-ipa: 包内没有 bundled-sources/*.js")

          manifest = [n for n in names if n.endswith("bundled-sources/manifest.json")]
          if manifest:
              m = json.loads(z.read(manifest[0]).decode("utf-8"))
              missing = []
              for s in m.get("sources", []):
                  f = s.get("file")
                  if f and not any(n.endswith("/bundled-sources/" + f) for n in names):
                      missing.append(f)
              if missing:
                  for f in missing:
                      print("  MISSING:", f)
                  raise SystemExit("ios-ipa: 清单引用的文件在包内不存在: " + ", ".join(missing))
              print("  manifest refs: " + str(len(m.get("sources", []))) + " all present")
          print("  packaged js: " + str(len(bs)) + ", all names OK")
          for n in sorted(bs):
              print("    " + n.rsplit("/", 1)[-1])
          PY

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folia-ipa
          path: Folia.ipa
          retention-days: 14

      # artifact 下载要登录 GitHub；Release 资产可以匿名下载，手机/Sideloadly 直接取。
      # 用固定 tag `ios-latest` 覆盖更新，地址恒定：
      #   https://github.com/<owner>/<repo>/releases/download/ios-latest/Folia.ipa
      - name: Publish IPA to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="ios-latest"
          cat > /tmp/release-notes.md <<EOF
          未签名 IPA。用 Sideloadly / AltStore 以自备 Apple ID 签名后安装。

          构建信息：
          - 提交：${{ github.sha }}
          - 引擎：应用内插件引擎（VITE_CUSTOM_SOURCE_ENGINE=local）
          - 网络：CapacitorHttp 已启用（跨域请求走原生，不受 WKWebView CORS 限制）
          - 后台播放：UIBackgroundModes=audio
          EOF
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" Folia.ipa \
            --title "Folia iOS (unsigned)" \
            --notes-file /tmp/release-notes.md
